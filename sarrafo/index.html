<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sarrafo</title>
<meta name="description" content="Sarrafo: arena de 20 lutadores. Em breve na Google Play.">
<!--
  A pagina do Sarrafo no site da LippeGames.
  A copia que vale esta no repositorio LippeGames/lippegames.github.io, em
  /sarrafo/. Esta aqui dentro do projeto e so a fonte, para nao se perder.

  11/10: o APK saiu do site (pedido do Philippe). O jogo vai pela Google
  Play; esta pagina so diz isso e leva a politica de privacidade.

  O versao.json AO LADO continua no ar: o jogo instalado le dele os anuncios
  (ligados, e a cada quantas partidas). A versao nele e "0.0" de proposito:
  assim nenhum celular ve aviso de atualizacao apontando para um APK que nao
  existe mais.
-->
<style>
  :root {
    --fundo: #121213;
    --caixa: #1c1c1f;
    --dourado: #f2cc4d;
    --texto: #ffffff;
    --texto-fraco: #9c9c9e;
    --contorno: #3a3a3c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 16px 56px;
    background: var(--fundo);
    color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  main { width: 100%; max-width: 440px; }
  h1 {
    font-size: 42px;
    letter-spacing: 3px;
    margin: 0 0 4px;
    text-align: center;
    color: var(--dourado);
  }
  .subtitulo {
    color: var(--texto-fraco);
    text-align: center;
    margin: 0 0 28px;
    font-size: 16px;
  }
  .aviso {
    background: var(--caixa);
    border: 1px solid var(--contorno);
    border-radius: 10px;
    padding: 18px 16px;
    font-size: 17px;
    line-height: 1.5;
    text-align: center;
  }
  .aviso strong { color: var(--dourado); }
  .links { margin-top: 28px; text-align: center; font-size: 15px; line-height: 2; }
  .links a { color: var(--texto-fraco); }
</style>
</head>
<body>
<main>
  <h1>SARRAFO</h1>
  <p class="subtitulo">arena de 20 lutadores</p>

  <div class="aviso">
    Em breve na <strong>Google Play</strong>.
  </div>

  <div class="links">
    <a href="privacidade.html">Política de Privacidade</a><br>
    <a href="../">LippeGames</a>
  </div>
</main>
</body>
</html>
